{# Logo de série « 第3弾 ヒ・ロ・コレクション HERO COLLECTION » — repère local 21,5 × 10,9 mm, mis à l'échelle par le conteneur #}
<div class="logo-serie" data-groupe="Logo de série" style="left:{{ lx }}mm; top:{{ ly }}mm; transform: scale({{ le }}); transform-origin: 0 0;">
  <svg class="abs" style="left:0;top:0;width:21.5mm;height:10.9mm;overflow:visible" viewBox="0 0 21.5 10.9">
    <ellipse data-nom="Ovale – contour" cx="10.72" cy="5.4" rx="10.42" ry="5.32" fill="#1a1a1a"/>
    <ellipse data-nom="Ovale – anneau jaune" cx="10.72" cy="5.4" rx="10.25" ry="5.15" fill="{{ C.logo_jaune }}"/>
    <ellipse data-nom="Ovale – rouge" cx="10.72" cy="5.4" rx="9.82" ry="4.74" fill="{{ C.logo_rouge }}"/>
  </svg>
  <div class="abs l-dai">第<span class="l-3">3</span>弾</div>
  <div class="abs l-titre-ombre"><span data-plein>ヒ・ロ・コレクション</span></div>
  <div class="abs l-titre"><span data-plein>ヒ・ロ・コレクション</span></div>
  <div class="abs l-hero"><span data-plein>HERO COLLECTION</span></div>
</div>
